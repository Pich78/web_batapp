  var guard = "batapp-version-" + build;

    fetch("site.webmanifest?batapp-check=" + Date.now(), {
      cache: "no-store",
      credentials: "same-origin"

      if (!response.ok) return null;

      if (!latest || latest === build) return;
      try {
        if (sessionStorage.getItem(guard) === latest) return;

    }).catch(function () {
      /* offline or unreadable manifest: keep the loaded build */
    });
  }
  check();
  window.addEventListener("pageshow", function (event) {
